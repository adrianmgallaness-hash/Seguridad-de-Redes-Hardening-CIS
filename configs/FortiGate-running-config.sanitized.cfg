# Configuracion posterior del laboratorio facilitada por el estudiante el 14-11-2026.
# Se omitieron objetos predeterminados ajenos al laboratorio, UUID y credenciales.
# Archivo documental sanitizado; no cargar directamente en el equipo.
config system global
    set alias "FortiGate-VM64-KVM"
    set hostname "FortiGate-VM64-KVM"
    set timezone 04
end

config system interface
    edit "port1"
        set vdom "root"
        set ip 10.21.39.2 255.255.255.252
        set allowaccess ping
        set type physical
        set snmp-index 1
    next
    edit "port2"
        set vdom "root"
        set ip 10.21.39.65 255.255.255.192
        set allowaccess ping https ssh
        set type physical
        set snmp-index 2
    next
end

config firewall address
    edit "PC-2139"
        set subnet 10.21.39.100 255.255.255.255
    next
    edit "R1-2139"
        set subnet 10.21.39.1 255.255.255.255
    next
end

config firewall policy
    edit 1
        set name "PC-a-R1-solo-PING"
        set srcintf "port2"
        set dstintf "port1"
        set action accept
        set srcaddr "PC-2139"
        set dstaddr "R1-2139"
        set schedule "always"
        set service "PING"
        set logtraffic all
    next
    edit 2
        set name "PC-a-R1-solo-SSH"
        set srcintf "port2"
        set dstintf "port1"
        set action accept
        set srcaddr "PC-2139"
        set dstaddr "R1-2139"
        set schedule "always"
        set service "SSH"
        set logtraffic all
    next
end

config router static
    edit 1
        set gateway 10.21.39.1
        set device "port1"
    next
end
