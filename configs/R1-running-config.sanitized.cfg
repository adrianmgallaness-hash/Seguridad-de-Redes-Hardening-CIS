! Exportacion documental de R1 facilitada por el estudiante el 14-11-2026.
! Original: show running-config | exclude secret
! Se omitieron lineas vacias y comentarios de separacion; no cargar este archivo en el equipo.
version 15.2
service tcp-keepalives-in
service tcp-keepalives-out
service timestamps debug datetime msec
service timestamps log datetime msec
hostname R1
boot-start-marker
boot-end-marker
no aaa new-model
no ip icmp rate-limit unreachable
no ip domain lookup
ip domain name lab2139.local
ip cef
no ipv6 cef
multilink bundle-name authenticated
ip tcp synwait-time 5
ip ssh version 2
interface FastEthernet0/0
 ip address 10.21.39.1 255.255.255.252
 duplex full
ip forward-protocol nd
no ip http server
no ip http secure-server
ip route 10.21.39.64 255.255.255.192 10.21.39.2
control-plane
line con 0
 exec-timeout 5 0
 privilege level 15
 logging synchronous
 stopbits 1
line aux 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
 no exec
 stopbits 1
line vty 0 4
 exec-timeout 5 0
 login local
 transport input ssh
end
