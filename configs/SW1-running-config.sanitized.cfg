! Exportación sanitizada de SW1, facilitada por el estudiante tras aplicar hardening.
! Se omitieron líneas de credenciales con 'secret' y banners del fabricante.
! Los marcadores y omisiones hacen que este archivo sea documental; no cargarlo en el equipo.
version 15.2
service tcp-keepalives-in
service tcp-keepalives-out
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
service compress-config
hostname SW1
boot-start-marker
boot-end-marker
no aaa new-model
ip domain-name lab2139.local
ip cef
no ipv6 cef
spanning-tree mode pvst
spanning-tree extend system-id
interface GigabitEthernet0/0
 switchport access vlan 10
 switchport mode access
 negotiation auto
interface GigabitEthernet0/1
 switchport access vlan 10
 switchport mode access
 negotiation auto
interface GigabitEthernet0/2
 negotiation auto
interface GigabitEthernet0/3
 negotiation auto
interface GigabitEthernet1/0
 negotiation auto
interface GigabitEthernet1/1
 negotiation auto
interface GigabitEthernet1/2
 negotiation auto
interface GigabitEthernet1/3
 negotiation auto
interface GigabitEthernet2/0
 negotiation auto
interface GigabitEthernet2/1
 negotiation auto
interface GigabitEthernet2/2
 negotiation auto
interface GigabitEthernet2/3
 negotiation auto
interface GigabitEthernet3/0
 negotiation auto
interface GigabitEthernet3/1
 negotiation auto
interface GigabitEthernet3/2
 negotiation auto
interface GigabitEthernet3/3
 negotiation auto
interface Vlan10
 ip address 10.21.39.66 255.255.255.192
ip default-gateway 10.21.39.65
ip forward-protocol nd
no ip http server
no ip http secure-server
ip ssh version 2
ip ssh server algorithm encryption aes128-ctr aes192-ctr aes256-ctr
ip ssh client algorithm encryption aes128-ctr aes192-ctr aes256-ctr
control-plane
! Banner original de Cisco omitido.
line con 0
 exec-timeout 5 0
line aux 0
 no exec
line vty 0 4
 exec-timeout 5 0
 login local
 transport input ssh
end
