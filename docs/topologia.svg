<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="440" viewBox="0 0 1160 440" role="img" aria-labelledby="title desc">
<title id="title">Topología del laboratorio de hardening CIS</title>
<desc id="desc">R1 conectado a FortiGate, FortiGate al switch SW1 y SW1 a Ubuntu, con direccionamiento basado en 2025-2139.</desc>
<rect width="1160" height="440" fill="#f8fafc"/>
<text x="50" y="52" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#142a40">Laboratorio CIS · matrícula 2025-2139</text>
<text x="50" y="80" font-family="Arial,sans-serif" font-size="16" fill="#475569">Tránsito 10.21.39.0/30 · LAN 10.21.39.64/26</text>
<line x1="256" y1="220" x2="354" y2="220" stroke="#4f6580" stroke-width="4"/>
<line x1="564" y1="220" x2="665" y2="220" stroke="#4f6580" stroke-width="4"/>
<line x1="875" y1="220" x2="970" y2="220" stroke="#4f6580" stroke-width="4"/>
<rect x="50" y="155" width="206" height="130" rx="18" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<rect x="354" y="155" width="210" height="130" rx="18" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
<rect x="665" y="155" width="210" height="130" rx="18" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<rect x="970" y="155" width="140" height="130" rx="18" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<g font-family="Arial,sans-serif" text-anchor="middle" fill="#102a43">
<text x="153" y="190" font-size="23" font-weight="700">R1</text><text x="153" y="222" font-size="17">Fa0/0</text><text x="153" y="250" font-size="17">10.21.39.1/30</text>
<text x="459" y="190" font-size="23" font-weight="700">FortiGate</text><text x="459" y="222" font-size="16">port1 .2/30 · port2 .65/26</text><text x="459" y="250" font-size="15">Políticas PING y SSH</text>
<text x="770" y="190" font-size="23" font-weight="700">SW1</text><text x="770" y="222" font-size="17">VLAN 10</text><text x="770" y="250" font-size="17">10.21.39.66/26</text>
<text x="1040" y="190" font-size="22" font-weight="700">Ubuntu</text><text x="1040" y="222" font-size="16">ens33</text><text x="1040" y="250" font-size="16">.100/26</text>
</g>
<g font-family="Arial,sans-serif" text-anchor="middle" font-size="14" fill="#475569">
<text x="305" y="202">Fa0/0 ↔ e0</text><text x="615" y="202">e1 ↔ Gi0/0</text><text x="922" y="202">Gi0/1 ↔ e0</text>
</g>
<rect x="50" y="336" width="1060" height="54" rx="12" fill="#e2e8f0"/>
<text x="70" y="370" font-family="Arial,sans-serif" font-size="16" fill="#334155">Ubuntu → FortiGate → R1: solo PING y SSH autorizados · SW1: SSH abierto, HTTP/HTTPS cerrados</text>
</svg>
